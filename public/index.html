<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>RVER</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .app {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            margin: auto;
            display: flex;
            flex-direction: column;
            background: white;
        }

        header {
            padding: 20px;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 5px 0 0;
            color: #777;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            margin-bottom: 15px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .user {
            margin-left: auto;
            background: #222;
            color: white;
        }

        .assistant {
            background: #eee;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        #message {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        #send {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        #send:hover {
            background: #444;
        }

        #send:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .typing {
            color: #888;
            font-style: italic;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #new-chat {
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }


        #stop {
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }

        #stop:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }


        .app {
            max-width: 1200px;
            flex-direction: row;
        }

        #sidebar {
            width: 250px;
            flex-shrink: 0;
            padding: 20px;
            border-right: 1px solid #ddd;
            overflow-y: auto;
        }

        #sidebar h2 {
            font-size: 18px;
            margin-top: 0;
        }

        .main-panel {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #new-chat,
        .conversation-item {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            text-align: left;
            cursor: pointer;
        }

        .conversation-item {
            overflow-wrap: anywhere;
        }

        .conversation-item.active {
            background: #eee;
        }

        @media (max-width: 650px) {
            #sidebar {
                width: 150px;
                padding: 10px;
            }

            #chat {
                padding: 15px;
            }

            .message {
                max-width: 90%;
            }
        }


        .assistant h1,
        .assistant h2,
        .assistant h3 {
            margin: 18px 0 8px;
        }

        .assistant p {
            margin: 8px 0;
        }

        .assistant ul,
        .assistant ol {
            padding-left: 24px;
        }

        .assistant pre {
            overflow-x: auto;
            padding: 12px;
            border-radius: 8px;
            background: #222;
            color: #f5f5f5;
        }

        .assistant code {
            font-family: Consolas, monospace;
        }

        .assistant a {
            color: #1769aa;
            overflow-wrap: anywhere;
        }

        .assistant blockquote {
            margin-left: 0;
            padding-left: 12px;
            border-left: 3px solid #bbb;
            color: #555;
        }



    </style>
</head>

<body>

    
    <div class="app">
        <aside id="sidebar">
            <h2>Conversations</h2>
            <button id="new-chat">+ New Chat</button>
            <div id="conversation-list"></div>
        </aside>

        <section class="main-panel">
            <header class="top-bar">
                <div>
                    <h1>RVER</h1>
                    <p>AI Agent</p>
                </div>
                <button id="stop" disabled>Stop</button>
            </header>

            <main id="chat"></main>

            <div class="input-area">
                <input
                    id="message"
                    type="text"
                    placeholder="Message RVER..."
                    autocomplete="off"
                >
                <button id="send">Send</button>
            </div>
        </section>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>


    <script>
        const message = document.getElementById("message");
        const send = document.getElementById("send");
        const chat = document.getElementById("chat");
        const newChat = document.getElementById("new-chat");
        const stop = document.getElementById("stop");
        const conversationList = document.getElementById("conversation-list");

        let clientId = localStorage.getItem("rver-client-id");

        if (!clientId) {
            clientId = crypto.randomUUID();
            localStorage.setItem("rver-client-id", clientId);
        }

        let controller = null;

        let sessionId = localStorage.getItem("rver-session-id");

        if (!sessionId) {
            sessionId = crypto.randomUUID();
            localStorage.setItem("rver-session-id", sessionId);
        }


        function renderMarkdown(element, text) {
            const html = marked.parse(text, {
                breaks: true,
                gfm: true
            });

            element.innerHTML = DOMPurify.sanitize(html);
        }


        function addMessage(text, type) {
            const element = document.createElement("div");

            element.classList.add(
                "message",
                type
            );

            if (type === "assistant") {
                renderMarkdown(element, text);
            } else {
                element.textContent = text;
            }

            chat.appendChild(element);

            chat.scrollTop = chat.scrollHeight;

            return element;
        }


        async function loadHistory() {
            try {
                const response = await fetch("/chat/history", {
                    headers: {
                        "x-session-id": sessionId
                    }
                });

                if (!response.ok) {
                    throw new Error("Could not load history");
                }

                const data = await response.json();

                chat.innerHTML = "";

                for (const item of data.messages) {
                    const type = item.role === "user"
                        ? "user"
                        : "assistant";

                    addMessage(item.content, type);
                }
            } catch (error) {
                console.error("History loading error:", error);
            }
        }


        async function loadConversations() {
            try {
                const response = await fetch("/chat/conversations", {
                    headers: {
                        "x-client-id": clientId
                    }
                });

                if (!response.ok) {
                    throw new Error("Could not load conversations");
                }

                const data = await response.json();
                conversationList.innerHTML = "";

                for (const conversation of data.conversations) {
                    const button = document.createElement("button");

                    button.className = "conversation-item";
                    button.textContent = conversation.title;
                    button.title = conversation.title;

                    if (conversation.id === sessionId) {
                        button.classList.add("active");
                    }

                    button.addEventListener("click", async () => {
                        if (controller) controller.abort();

                        sessionId = conversation.id;
                        localStorage.setItem("rver-session-id", sessionId);

                        await loadHistory();
                        await loadConversations();
                    });

                    conversationList.appendChild(button);
                }
            } catch (error) {
                console.error("Conversation list error:", error);
            }
        }



        async function sendMessage() {
            const text = message.value.trim();

            if (!text) return;

            addMessage(text, "user");

            message.value = "";
            send.disabled = true;

            const typing = addMessage("RVER is thinking...", "typing");

            controller = new AbortController();
            stop.disabled = false;

            try {
                const response = await fetch("/chat/stream", {
                    method: "POST",
                    
                    headers: {
                        "Content-Type": "application/json",
                        "x-session-id": sessionId,
                        "x-client-id": clientId
                    },

                    body: JSON.stringify({
                        message: text
                    }),
                    signal: controller.signal
                });

                if (!response.ok || !response.body) {
                    throw new Error("Streaming request failed");
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                let buffer = "";
                let answer = "";
                let assistantMessage = null;

                while (true) {
                    const { value, done } = await reader.read();

                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });

                    const events = buffer.split("\n\n");
                    buffer = events.pop() ?? "";

                    for (const event of events) {
                        const line = event
                            .split("\n")
                            .find(line => line.startsWith("data: "));

                        if (!line) continue;

                        const data = JSON.parse(line.slice(6));

                        if (data.error) {
                            throw new Error(data.error);
                        }

                        if (data.token) {
                            answer += data.token;

                            if (!assistantMessage) {
                                typing.remove();
                                assistantMessage = addMessage("", "assistant");
                            }

                            renderMarkdown(assistantMessage, answer);
                            chat.scrollTop = chat.scrollHeight;
                        }
                    }
                }

                if (buffer.trim()) {
                    const line = buffer
                        .split("\n")
                        .find(line => line.startsWith("data: "));

                    if (line) {
                        const data = JSON.parse(line.slice(6));

                        if (data.error) throw new Error(data.error);

                        if (data.token) {
                            answer += data.token;

                            if (!assistantMessage) {
                                typing.remove();
                                assistantMessage = addMessage("", "assistant");
                            }

                            renderMarkdown(assistantMessage, answer);
                        }
                    }
                }

                typing.remove();

                if (!answer) {
                    addMessage("RVER returned an empty response.", "assistant");
                }

            } catch (error) {
            if (error.name === "AbortError") {
                // The user stopped the response.
            } else {
                console.error("Chat error:", error);
                addMessage(
                    "Could not complete the request. Check that RVER is running.",
                    "assistant"
                );
            }
            } finally {
                send.disabled = false;
                message.focus();
                controller = null;
                stop.disabled = true;
                await loadConversations();
            }
        }


        send.addEventListener("click", sendMessage);

        message.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        newChat.addEventListener("click", async function () {
            sessionId = crypto.randomUUID();

            localStorage.setItem("rver-session-id", sessionId);

            chat.innerHTML = "";
            message.value = "";
            message.focus();

            await loadConversations();
        });

        stop.addEventListener("click", function () {
            if (controller) {
                controller.abort();
            }
        });

        message.focus();

        loadHistory();
        loadConversations();


    </script>

</body>

</html>
