<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RVER</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/vendor/purify.js" defer></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main id="login-panel" class="login-panel" hidden>
      <form id="login-form">
        <h1>RVER</h1>
        <p>Your local AI assistant.</p>
        <label for="access-key">Local access key</label>
        <input
          id="access-key"
          type="password"
          autocomplete="current-password"
          required
        />
        <button type="submit">Sign in</button>
        <p id="login-error" role="alert"></p>
      </form>
    </main>
    <div id="app" class="app" hidden>
      <aside id="sidebar" aria-label="Conversations and tools">
        <h2>Conversations</h2>
        <button id="new-chat">+ New chat</button>
        <div id="conversation-list"></div>
        <nav aria-label="Assistant tools">
          <button data-panel="memory">Memory</button>
          <button data-panel="tasks">Tasks</button>
          <button data-panel="runs">Run history</button>
          <button id="logout">Sign out</button>
        </nav>
      </aside>
      <section class="main-panel">
        <header>
          <button id="menu" aria-controls="sidebar" aria-expanded="false">
            Chats
          </button>
          <div>
            <h1>RVER</h1>
            <p>Your local AI assistant</p>
          </div>
          <button id="stop" disabled>Stop</button>
        </header>
        <button id="earlier" hidden>Load earlier messages</button>
        <div
          id="chat"
          role="log"
          aria-label="Conversation"
          aria-live="off"
        ></div>
        <section id="edits" aria-label="Proposed edits"></section>
        <p id="status" role="status" aria-live="polite">Ready</p>
        <form id="message-form" class="input-area">
          <label class="sr-only" for="message">Message RVER</label>
          <textarea
            id="message"
            rows="2"
            maxlength="12000"
            placeholder="Message RVER…"
            required
          ></textarea>
          <button id="send" type="submit">Send</button>
          <label class="edit-toggle"
            ><input id="edit-mode" type="checkbox" /> Allow edit
            proposals</label
          >
        </form>
      </section>
    </div>
    <dialog id="tools-dialog" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <h2 id="dialog-title"></h2>
        <button id="dialog-close" aria-label="Close">Close</button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
  </body>
</html>
